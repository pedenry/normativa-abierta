name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pruebas locales sin clave API
        run: |
          python -m pip install -r ingesta/requirements.txt
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s evaluacion/piloto_sua -p 'test_*.py' -v
          python -B -m unittest discover -s evaluacion/regresion_recuperacion -p 'test_*.py' -v
          python -B -m unittest discover -s experimentos/http-local/tests -p 'test_*.py' -v
          python -B -m unittest discover -s herramientas/tests -p 'test_*.py' -v
      - name: Recalcular consumo publicado
        run: python -B evaluacion/piloto_sua/resumir_consumo.py --run evaluacion/piloto_sua/resultados-publicos/evaluacion-20261110

  recuperacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regresión literal REBT, SUA y territorial (48 consultas)
        shell: bash
        run: |
          set -euo pipefail
          for fixture in casos.json casos-sua-residencial.json territorial/casos-territorial-1.json territorial/casos-territorial-2.json territorial/casos-territorial-3.json territorial/casos-contraste.json; do
            tag=$(basename "$fixture" .json)
            python -B evaluacion/regresion_recuperacion/ejecutar.py --fixture "evaluacion/regresion_recuperacion/$fixture" --salida ".local/ci/$tag.json" --estricto
          done
      - name: Búsqueda sin documento ni edición (23 consultas)
        run: |
          python -B evaluacion/regresion_recuperacion/territorial/ejecutar_libres.py --alternativas evaluacion/regresion_recuperacion/territorial/alternativas-libres-2026-11-16.json --salida .local/ci/libres.json
          python -B evaluacion/regresion_recuperacion/territorial/ejecutar_libres.py --fixture evaluacion/regresion_recuperacion/territorial/casos-libres-controles.json --salida .local/ci/controles.json
      - name: Aclaración y recuperación sin ubicación (20 consultas)
        run: python -B evaluacion/regresion_recuperacion/territorial/ejecutar_sin_ubicacion.py --salida .local/ci/sin-ubicacion.json

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks fijado y verificado
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore" --log-opts='--all' "$GITHUB_WORKSPACE"
